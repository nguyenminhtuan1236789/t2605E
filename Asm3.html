<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employment Separation Form</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="css/Asm3.css">
</head>
<body>

    <header class="header">
        <h1>Employment Separation Form</h1> 
    </header>

    <div class="container">
        <form>
            
            <div class="form-group">
                <label>Full Name</label>
                <div class="row">
                    <div class="col">
                        <div class="input-with-icon">
                            <i class="fa-regular fa-user"></i>
                            <input type="text">
                        </div>
                        <span class="hint">First Name</span>
                    </div>
                    <div class="col">
                        <input type="text">
                        <span class="hint">Last Name</span>
                    </div>
                </div>
            </div>

            
            <div class="form-group">
                <label>Employee ID</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-hashtag"></i>
                    <input type="text">
                </div>
            </div>

            
            <div class="form-group">
                <label>Personal Email</label>
                <div class="input-with-icon">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email">
                </div>
            </div>

           
            <div class="form-group">
                <label>Last Working Date</label>
                <div class="input-with-icon input-short">
                    <i class="fa-regular fa-calendar"></i>
                    <input type="date">
                </div>
                <span class="hint">dd-MMM-yyyy</span>
            </div>

            <!-- 5. Reason for Departure -->
            <div class="form-group">
                <label>Reason for Departure</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <input type="text">
                </div>
            </div>

            <div class="form-group">
                <label>Return of All Company Property</label>
                <div class="radio-box">
                    <input type="radio" name="property" id="yes">
                    <label for="return-yes"><span>Yes</span></label>
                </div>
                <div class="radio-box">
                    <input type="radio" name="property" id="no">
                    <label for="return-no"><span>No</span></label>
                </div>
                <div class="radio-box">
                    <input type="radio" name="property" id="other">
                    <label for="return-other"><span>Other</span></label>
                </div>
            </div>

            
            <div class="form-group">
                <label>Exit Interview Schedule</label>
                <div class="input-with-icon input-short">
                    <i class="fa-regular fa-calendar-days"></i>
                    <input type="datetime-local">
                </div>
                <span class="hint">dd-MMM-yyyy HH:MM AM/PM</span>
            </div>

            
            <div class="form-group">
                <label>Comments/ Feedback</label>
                <textarea rows="5"></textarea>
            </div>

            
            <div class="btn-container">
                <button type="submit" class="btn-submit">Submit</button>
            </div>

        </form>
    </div>

</body>
</html>
